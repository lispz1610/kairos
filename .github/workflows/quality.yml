name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      # verify_quality.sh is the single source of truth for local and CI checks.
      # It runs ruff, mypy, radon, pytest, traceability/docs-as-code validators,
      # import-linter contracts, bandit, vulture, pip-audit (advisory) and the
      # ISO 25010/5055 collector in this one invocation; do not add duplicates.
      - name: Run fast quality gate (static, tests, security, architecture and ISO metrics)
        run: bash ./verify_quality.sh
