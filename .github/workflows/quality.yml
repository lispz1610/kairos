name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      # verify_quality.sh is the single source of truth for local and CI checks.
      # It runs ruff, mypy, radon, pytest, validate_traceability.py,
      # generate_traceability_matrix.py --check and validate_docs_as_code.py in
      # this one invocation; do not add duplicate validator steps here.
      - name: Run fast quality gate (ruff, mypy, radon, pytest, traceability, docs-as-code)
        run: bash ./verify_quality.sh
