[project]
name = "kairos"
version = "0.1.0"
description = "Kairos — Traçador Dinâmico de Rotas Turísticas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.6",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.16.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.110.0",
    "mypy>=1.11.0",
    "ruff>=0.17.5",
    "radon>=6.0.1",
    "mutmut>=3.0.0",
    "import-linter>=2.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "vulture>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "requirement: rastreia um ou mais requisitos funcionais (RFxx) da especificação",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "C901", "PLR0911", "PLR0912", "PLR0913"]
ignore = ["D100", "D104"]

[tool.ruff.lint.mccabe]
max-complexity = 9

# Limites alinhados à base legada; C901 usa o mesmo teto numérico do radon (< 10).
[tool.ruff.lint.pylint]
max-args = 10
max-branches = 12
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ARQ-1: camadas hexagonais"
type = "layers"
containers = ["src"]
layers = ["adapters", "core"]

[[tool.importlinter.contracts]]
name = "ARQ-2: núcleo sem dependências de I/O web"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "httpcore",
    "requests",
    "sqlite3",
    "socket",
]
allow_indirect_imports = false

[tool.vulture]
paths = ["src"]
min_confidence = 80
# `host` faz parte da assinatura de httpcore.SyncBackend.connect_tcp e é
# deliberadamente ignorado: o backend fixa o IP validado na conexão.
ignore_names = ["host"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
