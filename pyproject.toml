[project]
name = "kairos"
version = "0.1.0"
description = "Kairos — Traçador Dinâmico de Rotas Turísticas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.2",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.6",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.16.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.110.0",
    "mypy>=1.11.0",
    "ruff>=0.17.5",
    "radon>=6.0.1",
    "mutmut>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
